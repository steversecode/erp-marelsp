<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Card Background -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="12.5" fill="white"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="12.5" stroke="#DCE0E5"/>

  <!-- Left Component Box (Original) -->
  <g filter="drop-shadow(0px 2px 3px rgba(0,0,0,0.08))">
    <rect x="11" y="24" width="16" height="16" rx="4" fill="#3B82F6"/>
    <!-- Small Cog/Component motif -->
    <circle cx="19" cy="32" r="3.5" fill="white"/>
    <circle cx="19" cy="32" r="1.5" fill="#1D4ED8"/>
  </g>

  <!-- Right Component Box (Substitute / Switched) -->
  <g filter="drop-shadow(0px 2px 3px rgba(0,0,0,0.08))">
    <rect x="37" y="24" width="16" height="16" rx="4" fill="#10B981"/>
    <!-- Small Star/Check motif -->
    <path d="M43 32L44.5 33.5L47.5 30" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Top Swap Arrow (Left to Right) -->
  <path d="M22 17C26 14.5 34 14.5 40 18" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M37 15L41.5 18.5L37.5 21" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom Swap Arrow (Right to Left) -->
  <path d="M42 47C38 49.5 30 49.5 24 46" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M27 49L22.5 45.5L26.5 43" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Switch Connector Node -->
  <circle cx="32" cy="32" r="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
</svg>
